version: "3.8"

x-common-variables: &common-env
  ENV: development
  JWT_SECRET: super_secret_key_change_me_in_prod

services:
  # ==========================================
  # 1. CORE POSTGRES (User, User_Skill, Review)
  # ==========================================
  postgres-core:
    image: postgres:15-alpine
    container_name: db-postgres-core
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/core:/docker-entrypoint-initdb.d
      - pg_core_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ==========================================
  # 2. SCHEDULE POSTGRES
  # ==========================================
  postgres-schedule:
    image: postgres:15-alpine
    container_name: db-postgres-schedule
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schedule_db
    ports:
      - "5433:5432"
    volumes:
      - ./db/schedule:/docker-entrypoint-initdb.d
      - pg_schedule_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ==========================================
  # 3. MONGODB
  # ==========================================
  mongodb-chat:
    image: mongo:6.0
    container_name: db-mongodb-chat
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: chat_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_chat_data:/data/db
    networks:
      - microservices-network

  # ==========================================
  # SERVICES IMPLEMENTATION
  # ==========================================
  gateway:
    build: ./services/gateway
    container_name: service-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./services/gateway:/app
    environment:
      <<: *common-env
      USER_SERVICE_URL: http://user:3000
      CHAT_SERVICE_URL: http://chat:8081
    networks:
      - microservices-network

  user:
    build: 
      context: ./services/user
      dockerfile: Dockerfile
    container_name: service-user
    ports:
      - "3000:3000"
    volumes:
      - ./services/user:/app
      - /app/node_modules
    environment:
      <<: *common-env
      PORT: 3000
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  review:
    build: ./services/review
    container_name: service-review
    command: python -B -m uvicorn main:app --host 0.0.0.0 --port 3001
    ports:
      - "3001:3001"
    volumes:
      - ./services/review:/app
    environment:
      <<: *common-env
      PORT: 3001
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  skill:
    build: ./services/skill
    container_name: service-skill
    ports:
      - "3002:3002"
    volumes:
      - ./services/skill:/app
      - /app/node_modules
    environment:
      <<: *common-env
      PORT: 3002
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  schedule:
    build: ./services/schedule
    container_name: service-schedule
    ports:
      - "8000:8000"
    volumes:
      - ./services/schedule:/app
    environment:
      <<: *common-env
      PORT: 8000
      DB_URI: postgres://admin:password@postgres-schedule:5432/schedule_db
    depends_on:
      - postgres-schedule
    networks:
      - microservices-network

  chat:
    build: ./services/chat
    container_name: service-chat
    ports:
      - "8081:8081"
    volumes:
      - ./services/chat:/app
    environment:
      <<: *common-env
      MONGO_URI: mongodb://admin:password@mongodb-chat:27017/chat_db?authSource=admin
    depends_on:
      - mongodb-chat
    networks:
      - microservices-network

# Infrastructure Definitions
networks:
  microservices-network:
    driver: bridge

volumes:
  pg_core_data:
    driver: local
  pg_schedule_data:
    driver: local
  mongo_chat_data:
    driver: local
