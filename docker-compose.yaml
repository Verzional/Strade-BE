version: "3.8"

x-common-variables: &common-env
  ENV: development
  JWT_SECRET: ${JWT_SECRET}

services:
  # ==========================================
  # DATABASES
  # ==========================================
  postgres-core:
    image: postgres:15-alpine
    container_name: db-postgres-core
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/core:/docker-entrypoint-initdb.d
      - pg_core_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  postgres-schedule:
    image: postgres:15-alpine
    container_name: db-postgres-schedule
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schedule_db
    ports:
      - "5433:5432"
    volumes:
      - ./db/schedule:/docker-entrypoint-initdb.d
      - pg_schedule_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  mongodb-chat:
    image: mongo:6.0
    container_name: db-mongodb-chat
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: chat_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_chat_data:/data/db
    networks:
      - microservices-network

  # ==========================================
  # API GATEWAY
  # ==========================================
  gateway:
    build: ./services/gateway
    container_name: service-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./services/gateway:/app
    environment:
      <<: *common-env
    networks:
      - microservices-network

  # ==========================================
  # SINGLE INSTANCE SERVICES (Low Traffic / WebSockets)
  # ==========================================
  user:
    build: 
      context: ./services/user
      dockerfile: Dockerfile
    container_name: user
    ports:
      - "2000:2000"
    volumes:
      - ./services/user:/app
      - /app/node_modules
    environment:
      <<: *common-env
      PORT: 2000
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  chat:
    build: ./services/chat
    container_name: chat
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      MONGO_URI: mongodb://admin:password@mongodb-chat:27017/chat_db?authSource=admin
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
    depends_on:
      - mongodb-chat
      - postgres-core
    networks:
      - microservices-network

  # ==========================================
  # LOAD BALANCED SERVICES (High Traffic)
  # ==========================================
  review-1:
    build: ./services/review
    container_name: review-1
    command: python -B -m uvicorn main:app --host 0.0.0.0 --port 3001
    ports:
      - "3001:3001"
    volumes:
      - ./services/review:/app
    environment:
      <<: *common-env
      PORT: 3001
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  review-2:
    build: ./services/review
    container_name: review-2
    command: python -B -m uvicorn main:app --host 0.0.0.0 --port 3001
    ports:
      - "3011:3001"
    volumes:
      - ./services/review:/app
    environment:
      <<: *common-env
      PORT: 3001
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  skill-1:
    build: ./services/skill
    container_name: skill-1
    ports:
      - "3002:3002"
    volumes:
      - ./services/skill:/app
      - /app/node_modules
    environment:
      <<: *common-env
      PORT: 3002
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  skill-2:
    build: ./services/skill
    container_name: skill-2
    ports:
      - "3012:3002"
    volumes:
      - ./services/skill:/app
      - /app/node_modules
    environment:
      <<: *common-env
      PORT: 3002
      DB_URI: postgres://admin:password@postgres-core:5432/core_db
    depends_on:
      - postgres-core
    networks:
      - microservices-network

  schedule-1:
    build: ./services/schedule
    container_name: schedule-1
    ports:
      - "8000:8000"
    volumes:
      - ./services/schedule:/app
    environment:
      <<: *common-env
      PORT: 8000
      DB_URI: postgres://admin:password@postgres-schedule:5432/schedule_db
    depends_on:
      - postgres-schedule
    networks:
      - microservices-network

  schedule-2:
    build: ./services/schedule
    container_name: schedule-2
    ports:
      - "8001:8000"
    volumes:
      - ./services/schedule:/app
    environment:
      <<: *common-env
      PORT: 8000
      DB_URI: postgres://admin:password@postgres-schedule:5432/schedule_db
    depends_on:
      - postgres-schedule
    networks:
      - microservices-network

# Infrastructure Definitions
networks:
  microservices-network:
    driver: bridge

volumes:
  pg_core_data:
    driver: local
  pg_schedule_data:
    driver: local
  mongo_chat_data:
    driver: local